<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatGames Studio</title>
<meta name="description" content="CatGames Studio: jogos feitos com carinho. Conheça o Puzzle Fables, quebra-cabeças que contam histórias.">
<link rel="icon" href="icone.png">
<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 38rem; margin: 0 auto; padding: 3rem 1.25rem 4rem;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1a1a1a; background: #fff; text-align: center;
  }
  h1 { font-size: 2rem; margin: 1rem 0 .25rem; }
  .sub { color: #666; margin: 0 0 2.5rem; }
  .card { background: #f4f4f6; border-left: 3px solid #c8862b; border-radius: 8px;
          padding: 1.5rem; text-align: left; }
  .card img { width: 96px; height: 96px; border-radius: 20px; float: left; margin: 0 1.25rem .5rem 0; }
  .card h2 { margin: 0 0 .25rem; font-size: 1.3rem; }
  .card p { margin: .25rem 0 1rem; }
  .btn { display: inline-block; background: #c8862b; color: #fff; text-decoration: none;
         padding: .6rem 1.2rem; border-radius: 999px; font-weight: 600; }
  footer { margin-top: 3rem; font-size: .9rem; color: #666; }
  a { color: #a86a14; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e6e6; background: #16161a; }
    .sub, footer { color: #9a9aa0; }
    .card { background: #202028; }
    a { color: #e0a64a; }
  }
</style>
</head>
<body>
<img src="icone.png" alt="Gato da CatGames Studio" width="112" height="112" style="border-radius:24px">
<h1>CatGames Studio</h1>
<p class="sub">Jogos feitos com carinho.</p>

<div class="card">
  <img src="icone.png" alt="Ícone do Puzzle Fables">
  <h2>Puzzle Fables</h2>
  <p>Quebra-cabeças que contam histórias. Cada fábula termina com uma moral.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.rafaelrubio.puzzlefable">Baixar no Google Play</a>
</div>

<footer>
  <p><a href="https://rafaelrubio21.github.io/puzzle-fables-privacidade/">Política de privacidade do Puzzle Fables</a></p>
  <p>Contato: <a href="mailto:rafaelrubiodev@gmail.com">rafaelrubiodev@gmail.com</a></p>
  <p>© CatGames Studio</p>
</footer>
</body>
</html>
